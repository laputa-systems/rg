name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install Linux musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --bin rg --target "${{ matrix.target }}"

      - name: Package binary
        run: cp "target/${{ matrix.target }}/release/rg" "rg-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rg-${{ matrix.target }}
          path: rg-${{ matrix.target }}

  release:
    name: Create pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rg-*
          path: dist
          merge-multiple: true

      - name: Verify Linux ELF artifacts are fully static
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          command -v readelf >/dev/null
          X86_64_COUNT=0
          AARCH64_COUNT=0
          for binary in dist/**/*; do
            [[ -f "$binary" ]] || continue
            if ! readelf -h "$binary" >/dev/null 2>&1; then
              continue
            fi
            machine=$(readelf -h "$binary" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')
            case "$machine" in
              "Advanced Micro Devices X86-64") X86_64_COUNT=$((X86_64_COUNT + 1)) ;;
              AArch64) AARCH64_COUNT=$((AARCH64_COUNT + 1)) ;;
              *) printf '%s has unsupported ELF machine %s\n' "$binary" "$machine" >&2; exit 1 ;;
            esac
            program_headers=$(readelf -lW "$binary")
            if [[ "$program_headers" == *INTERP* ]]; then
              printf '%s has a dynamic ELF interpreter\n' "$binary" >&2
              exit 1
            fi
            dynamic_section=$(readelf -dW "$binary")
            if [[ "$dynamic_section" == *NEEDED* ]]; then
              printf '%s has a dynamic library dependency\n' "$binary" >&2
              exit 1
            fi
          done
          if [[ "$X86_64_COUNT" -ne 1 || "$AARCH64_COUNT" -ne 1 ]]; then
            printf 'Expected one x86_64 and one aarch64 Linux ELF artifact, found x86_64=%s aarch64=%s\n' "$X86_64_COUNT" "$AARCH64_COUNT" >&2
            exit 1
          fi

      - name: Zip artifacts
        run: for f in dist/*; do zip -9 --junk-paths "$f.zip" "$f"; done
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$RELEASE_TAG"
